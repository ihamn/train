<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>至冬列车 · 玩法小样</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#07090c;
    font-family:"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none}
  /* ★ 竖屏设计稿 720×1280 —— 真机 411×914 视口下 scale≈0.57，铺满屏幕 */
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
         width:720px;height:1280px;overflow:hidden;background:#0d1420}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;pointer-events:none}

  /* 进度条 + 站点 */
  #progWrap{left:24px;right:24px;top:20px;height:70px}
  #progBg{position:absolute;left:0;right:0;top:44px;height:14px;border-radius:7px;background:#ffffff22}
  #progFill{position:absolute;left:0;top:44px;height:14px;border-radius:7px;
            background:linear-gradient(90deg,#6fd3de,#F6E1BA);width:0}
  #progMsg{position:absolute;left:0;right:0;top:0;text-align:center;
           font-size:28px;color:#cfe0ef;text-shadow:0 2px 0 #0007}
  #stationMark{position:absolute;left:0;right:0;top:44px;height:14px}
  .stn{position:absolute;top:-7px;width:6px;height:28px;border-radius:3px;background:#F6E1BA}

  /* 表盘 */
  #speedDial{left:24px;top:100px}
  #tempDial{right:24px;top:100px}

  /* 档位 */
  #gearBox{left:270px;top:322px;width:180px;text-align:center}
  #gearNum{font-size:118px;font-weight:800;line-height:1;color:#EAF3FB;text-shadow:0 5px 0 #0009}
  #gearLbl{font-size:26px;letter-spacing:.34em;opacity:.7;color:#cfe0ef;margin-top:-4px}
  #zoneName{left:160px;top:474px;width:400px;text-align:center;
            font-size:34px;font-weight:700;color:#FFD98A;text-shadow:0 3px 0 #0008}

  /* 按钮 */
  .btn{position:absolute;pointer-events:auto;border:none;border-radius:26px;
       color:#EAF3FB;font-weight:800;letter-spacing:.05em;
       background:linear-gradient(#3d5164,#2a3a48);
       box-shadow:0 8px 0 #16202a,0 12px 22px #0008;transition:transform .05s,box-shadow .05s}
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 #16202a}
  .btn[disabled]{opacity:.32;filter:grayscale(.6)}
  #btnUp{right:24px;bottom:24px;width:330px;height:150px;font-size:50px}
  #btnDn{right:24px;bottom:188px;width:330px;height:150px;font-size:50px}
  #btnAgain{left:24px;bottom:188px;width:300px;height:150px;font-size:34px;
            background:linear-gradient(#5a4a3a,#3e3226);box-shadow:0 8px 0 #241d15,0 12px 22px #0008}
  #btnStart{left:50%;top:50%;transform:translate(-50%,-50%);
            width:420px;height:140px;font-size:50px}
  #btnStart:active{transform:translate(-50%,calc(-50% + 6px))}

  /* 遮罩 */
  #ov{position:absolute;inset:0;background:#050a12ee;display:flex;flex-direction:column;
      align-items:center;justify-content:center;color:#dbe8f4;text-align:center;padding:48px}
  #ov.hide{display:none}
  #ov h1{font-size:66px;margin:0 0 16px;color:#F6E1BA}
  #ov p{font-size:30px;line-height:1.65;margin:10px 0;max-width:600px;opacity:.92}
  #ov .big{font-size:56px;color:#4BDEE3;font-weight:800}
  #toast{left:50%;top:560px;transform:translateX(-50%);font-size:42px;font-weight:800;
         opacity:0;transition:opacity .25s;text-shadow:0 3px 0 #0009;
         white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="720" height="1280"></canvas>

  <div class="hud" id="progWrap">
    <div id="progMsg"></div>
    <div id="progBg"></div>
    <div id="progFill"></div>
    <div id="stationMark"></div>
  </div>

  <canvas class="hud" id="speedDial" width="326" height="210"></canvas>
  <canvas class="hud" id="tempDial"  width="316" height="210"></canvas>

  <div class="hud" id="gearBox"><div id="gearNum">0</div><div id="gearLbl">档 位</div></div>
  <div class="hud" id="zoneName">—</div>

  <button class="btn" id="btnAgain">↻ 重来</button>
  <button class="btn" id="btnDn">▼ 降档</button>
  <button class="btn" id="btnUp">▲ 升档</button>

  <div class="hud" id="toast"></div>

  <div id="ov">
    <h1>至冬列车</h1>
    <p>读限速区间 → <b>升档 / 降档</b> → 稳在区间里持续得分</p>
    <p>每次换档 <b>轴温 +1/4</b>。轴温满 ⇒ 档位锁 0，强制空档冷却。</p>
    <p style="opacity:.6">没有 game over —— 只有"被罚站"。</p>
    <button class="btn" id="btnStart">开始</button>
  </div>
</div>

<script>

const trainImg = new Image();
let trainReady = false;
trainImg.onload = ()=>{ trainReady = true; };
trainImg.src = TRAIN_PNG;

/* ══════ 自适应：竖屏 720×1280，等比缩放并居中 ══════ */
const DESIGN_W = 720, DESIGN_H = 1280;

/* ══════ 参数 ══════ */
const CFG = {
  gears: 6, accelUnit: 0.278, drag: 0.060,
  heatPerShift: 0.25, coolPerSec: 0.07, lockSec: 3.0,
  kmh: 3.6, ptsPerSec: 10, timeScale: 2.0, trackLen: 1500,
};
const ZONES = [
  {from:   0, to: 250, lo:25, hi: 55, name:"出站加速"},
  {from: 250, to: 515, lo:55, hi: 85, name:"正线"},
  {from: 515, to: 735, lo:30, hi: 55, name:"施工慢行"},
  {from: 735, to:1040, lo:70, hi:100, name:"长直道"},
  {from:1040, to:1290, lo:40, hi: 70, name:"进站前"},
  {from:1290, to:1500, lo:10, hi: 40, name:"终到停车"},
];
const STATIONS = [{at: 515, name:"青墟站"}, {at: 1500, name:"至冬站"}];
const zoneAt = p => ZONES.find(z => p>=z.from && p<z.to) || null;

/* ══════ 状态 ══════ */
let gear=0, speed=0, heat=0, pos=0, score=0, t=0, lock=0;
let running=false, done=false, lockCount=0, heldSec=0, badSec=0, stillSec=0;
let lastZone=null, stationDone={}, firstHold=false;
const S={toastUntil:0};

function main(){
  const stage = document.getElementById("stage");
  if(!stage){ document.body.innerHTML='<p style="color:#fff;padding:20px;font-size:20px">错误：找不到 #stage</p>'; return; }
  const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  const cvS=document.getElementById("speedDial"), gS=cvS.getContext("2d");
  const cvT=document.getElementById("tempDial"), gT=cvT.getContext("2d");
  const elGear=document.getElementById("gearNum"), elZone=document.getElementById("zoneName");
  const elFill=document.getElementById("progFill"), elMsg=document.getElementById("progMsg");
  const elMark=document.getElementById("stationMark"), elToast=document.getElementById("toast");
  const btnUp=document.getElementById("btnUp"), btnDn=document.getElementById("btnDn");

  function fit(){
    const s=Math.min(innerWidth/DESIGN_W, innerHeight/DESIGN_H);
    stage.style.transform=`translate(-50%,-50%) scale(${s})`;
  }
  addEventListener("resize",fit); addEventListener("orientationchange",fit); fit();

  /* 站点标记 */
  for(const st of STATIONS){
    const d=document.createElement("div");
    d.className="stn"; d.style.left=(100*st.at/CFG.trackLen)+"%";
    elMark.appendChild(d);
  }

  function reset(){
    gear=0;speed=0;heat=0;pos=0;score=0;t=0;lock=0;
    running=true;done=false;lockCount=0;heldSec=0;badSec=0;stillSec=0;
    lastZone=null;stationDone={};firstHold=false;
    document.getElementById("ov").classList.add("hide");
    toast("先点【▲ 升档】让车动起来","#7FE0A8",3.0);
  }
  function toast(msg,color,secs){
    S.toastUntil=t+(secs||1.3);
    elToast.textContent=msg; elToast.style.color=color||"#fff"; elToast.style.opacity=1;
  }
  function shift(d){
    if(!running||done||lock>0) return;
    const ng=Math.max(0,Math.min(CFG.gears,gear+d));
    if(ng===gear) return;
    gear=ng;
    const before=heat; heat=Math.min(1,heat+CFG.heatPerShift);
    if(heat>=1&&before<1){
      lock=CFG.lockSec; gear=0; lockCount++;
      toast("轴温满！档位锁 0 —— 强制空档","#FF7A55",1.8);
    } else if(heat>=0.8&&before<0.8){
      toast("轴温偏高，注意冷却","#FFB347",1.4);
    }
  }
  function step(dt){
    t+=dt;
    if(lock>0){ lock-=dt; if(lock<=0) toast("冷却完成","#7FE0A8",1.0); }
    speed=Math.max(0, speed+(gear*CFG.accelUnit - speed*CFG.drag)*dt);
    heat=Math.max(0, heat-CFG.coolPerSec*dt);
    pos+=speed*dt;
    if(speed<0.15 && lock<=0){
      stillSec+=dt;
      if(stillSec>1.6 && stillSec-dt<=1.6 && !done){
        toast(gear===0?"点【▲ 升档】起步！":"档位太低，再升一档","#FFB347",2.2);
        stillSec=0;
      }
    } else stillSec=0;

    const z=zoneAt(pos);
    if(z){
      if(z!==lastZone){ lastZone=z; toast("进入 "+z.name+"  "+z.lo+"~"+z.hi,"#FFB347",1.5); }
      const v=speed*CFG.kmh;
      if(v>=z.lo&&v<=z.hi){
        score+=CFG.ptsPerSec*dt; heldSec+=dt;
        if(!firstHold){ firstHold=true; toast("第一次稳住限速！","#7FE0A8",2.0); }
      } else badSec+=dt;
    }
    for(const st of STATIONS){
      if(stationDone[st.name]) continue;
      if(pos<st.at-8) continue;
      stationDone[st.name]=true;
      const errM=Math.abs(pos-st.at), errV=speed*CFG.kmh;
      let pts=0,msg;
      if(errV>6){ msg="没停 · "+st.name; }
      else { pts=Math.max(0,Math.round(70-errM*7));
             msg=(errM<2.5?"完美对位！":"停靠偏了 ")+st.name+" +"+pts+" 分"; }
      score+=pts;
      toast(msg, pts>0&&errM<2.5?"#7FE0A8":"#FFB347",1.8);
    }
    if(pos>=CFG.trackLen){ running=false; done=true; finish(); }
  }

  /* ══════ 场景绘制（竖屏：轨道横穿，列车居中）══════ */
  const RAIL_Y = 830;                     // 轨道在设计坐标里的 y
  function draw(){
    const W=cv.width,H=cv.height;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#0b1220"); g.addColorStop(.38,"#16283f"); g.addColorStop(.62,"#2a4a6b");
    g.addColorStop(1,"#1b3550");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // 远山
    ctx.fillStyle="#1d3350";
    for(let i=-1;i<5;i++){
      const x=((i*260 - pos*0.12)%(W+520))-260;
      ctx.beginPath(); ctx.moveTo(x,RAIL_Y-60);
      ctx.lineTo(x+150,RAIL_Y-320); ctx.lineTo(x+300,RAIL_Y-60); ctx.closePath(); ctx.fill();
    }
    // 雪地
    ctx.fillStyle="#31527a"; ctx.fillRect(0,RAIL_Y-40,W,H-(RAIL_Y-40));
    ctx.fillStyle="#3d6390"; ctx.fillRect(0,RAIL_Y-40,W,8);
    // 枕木 + 双轨
    for(let x=-((pos*2.6)%64);x<W+64;x+=64){
      ctx.fillStyle="#24374f"; ctx.fillRect(x,RAIL_Y-16,30,40);
    }
    ctx.fillStyle="#8fa6bd"; ctx.fillRect(0,RAIL_Y-5,W,5);
    ctx.fillStyle="#6d8399"; ctx.fillRect(0,RAIL_Y+21,W,4);
    // 限速牌（在列车前方出现）
    for(const z of ZONES){
      const d=z.from-pos;
      if(d<-20||d>330) continue;
      const x=W*0.50+d*1.5;
      if(x<-50||x>W+50) continue;
      ctx.fillStyle="#4a5f75"; ctx.fillRect(x-4,RAIL_Y-150,8,150);
      const col = z.hi>=100?"#C8382E" : z.hi>=85?"#D6A32E" : "#4FA85E";
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,RAIL_Y-172,34,0,7); ctx.fill();
      ctx.fillStyle="#0d1420"; ctx.font="bold 26px sans-serif"; ctx.textAlign="center";
      ctx.fillText(z.hi,x,RAIL_Y-163);
    }
    drawTrain(W*0.50, RAIL_Y);
  }
  function drawTrain(cx, railY){
    const SCALE=2.55;                       // 240*2.55 = 612 px 宽
    const w=240*SCALE, h=66*SCALE;
    ctx.fillStyle="#00000045";
    ctx.beginPath(); ctx.ellipse(cx+8, railY-4, w*0.44, 12, 0, 0, 7); ctx.fill();
    if(trainReady){
      ctx.imageSmoothingEnabled=false;      // ★ 像素画关插值
      ctx.drawImage(trainImg, Math.round(cx-w/2), Math.round(railY-h-6),
                    Math.round(w), Math.round(h));
    }
  }

  /* ══════ 速度表 ══════ */
  function drawSpeed(){
    const W=cvS.width,H=cvS.height; gS.clearRect(0,0,W,H);
    const cx=W/2, cy=H-26, R=132;
    const A0=Math.PI, A1=2*Math.PI;
    const a2=v=>A0+(A1-A0)*Math.min(1,v/120);
    gS.lineWidth=26; gS.lineCap="butt";
    gS.strokeStyle="#ffffff18"; gS.beginPath(); gS.arc(cx,cy,R,A0,A1); gS.stroke();
    for(const [lo,hi,col] of [[0,40,"#3AA0C8"],[40,70,"#4FA85E"],[70,88,"#D6A32E"],[88,120,"#C8382E"]]){
      gS.strokeStyle=col; gS.beginPath(); gS.arc(cx,cy,R,a2(lo),a2(hi)); gS.stroke();
    }
    const z=zoneAt(pos);
    if(z){ gS.lineWidth=7; gS.strokeStyle="#ffffffdd";
      gS.beginPath(); gS.arc(cx,cy,R+19,a2(z.lo),a2(z.hi)); gS.stroke(); }
    const v=speed*CFG.kmh, a=a2(v);
    gS.strokeStyle="#F6E1BA"; gS.lineWidth=7; gS.lineCap="round";
    gS.beginPath(); gS.moveTo(cx,cy); gS.lineTo(cx+Math.cos(a)*(R-16), cy+Math.sin(a)*(R-16)); gS.stroke();
    gS.fillStyle="#F6E1BA"; gS.beginPath(); gS.arc(cx,cy,9,0,7); gS.fill();
    gS.fillStyle="#EAF3FB"; gS.font="bold 54px sans-serif"; gS.textAlign="center";
    gS.fillText(Math.round(v), cx, cy-34);
    gS.fillStyle="#9fb4c8"; gS.font="22px sans-serif";
    gS.fillText("km/h", cx, cy-8);
  }
  /* ══════ 轴温表 ══════ */
  function drawTemp(){
    const W=cvT.width,H=cvT.height; gT.clearRect(0,0,W,H);
    const cx=W/2, cy=H-26, R=104;
    const A0=Math.PI*1.12, A1=Math.PI*1.88;
    const a=v=>A0+(A1-A0)*Math.min(1,Math.max(0,v));
    gT.lineWidth=24; gT.lineCap="butt";
    gT.strokeStyle="#ffffff18"; gT.beginPath(); gT.arc(cx,cy,R,A0,A1); gT.stroke();
    gT.strokeStyle="#3AA0C8"; gT.beginPath(); gT.arc(cx,cy,R,A0,a(0.5)); gT.stroke();
    gT.strokeStyle="#D6A32E"; gT.beginPath(); gT.arc(cx,cy,R,a(0.5),a(1)); gT.stroke();
    for(let i=0;i<=4;i++){
      const aa=a(i/4);
      gT.strokeStyle="#0d1420"; gT.lineWidth=4;
      gT.beginPath();
      gT.moveTo(cx+Math.cos(aa)*(R-15), cy+Math.sin(aa)*(R-15));
      gT.lineTo(cx+Math.cos(aa)*(R+15), cy+Math.sin(aa)*(R+15)); gT.stroke();
    }
    const av=a(heat);
    gT.strokeStyle = lock>0 ? "#FF6B4A" : (heat>0.75 ? "#FF9A3C" : "#EAF3FB");
    gT.lineWidth=7; gT.lineCap="round";
    gT.beginPath(); gT.moveTo(cx,cy);
    gT.lineTo(cx+Math.cos(av)*(R-18), cy+Math.sin(av)*(R-18)); gT.stroke();
    gT.fillStyle="#EAF3FB"; gT.beginPath(); gT.arc(cx,cy,8,0,7); gT.fill();
    gT.fillStyle="#9fb4c8"; gT.font="22px sans-serif"; gT.textAlign="center";
    gT.fillText("轴温", cx, cy-56);
  }

  function hud(){
    elGear.textContent = lock>0 ? "0" : gear;
    elGear.style.color = lock>0 ? "#FF7A55" : "#EAF3FB";
    const z=zoneAt(pos);
    if(z){
      const v=speed*CFG.kmh, inz=v>=z.lo&&v<=z.hi;
      elZone.textContent=z.name+"  "+z.lo+"~"+z.hi;
      elZone.style.color=inz?"#7FE0A8":"#FFD98A";
    } else elZone.textContent="—";
    elFill.style.width=(100*Math.min(1,pos/CFG.trackLen))+"%";
    elMsg.textContent="得分 "+Math.round(score)+"　·　被锁 "+lockCount+" 次　·　"+Math.round(pos)+"/"+CFG.trackLen+" m";
    btnUp.disabled = lock>0 || !running;
    btnDn.disabled = lock>0 || !running;
    if(t>S.toastUntil) elToast.style.opacity=0;
  }
  function finish(){
    const acc = heldSec+badSec>0 ? heldSec/(heldSec+badSec) : 0;
    const ov=document.getElementById("ov");
    ov.classList.remove("hide");
    ov.innerHTML='<h1>跑完全程</h1>'+
      '<p class="big">得分 '+Math.round(score)+'</p>'+
      '<p>合规 '+heldSec.toFixed(0)+' 秒　·　越界 '+badSec.toFixed(0)+' 秒　·　合规率 '+(100*acc).toFixed(0)+'%</p>'+
      '<p>轴温满导致锁档 <b>'+lockCount+'</b> 次</p>'+
      '<button class="btn" id="btnRetry" style="position:static;transform:none;margin-top:28px">再跑一次</button>';
    document.getElementById("btnRetry").onclick=reset;
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(running&&!done) step(dt*CFG.timeScale);
    draw(); drawSpeed(); drawTemp(); hud();
    requestAnimationFrame(loop);
  }

  addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if(k==="arrowup"||k==="w"){ shift(1); e.preventDefault(); }
    else if(k==="arrowdown"||k==="s"){ shift(-1); e.preventDefault(); }
    else if(k==="r"){ running=false; done=false; reset(); }
  });
  function bindHold(el,fn){
    let timer=null,iv=null;
    const start=e=>{ e.preventDefault(); fn();
      timer=setTimeout(()=>{ iv=setInterval(fn,110); },320); };
    const end=()=>{ clearTimeout(timer); clearInterval(iv); timer=iv=null; };
    el.addEventListener("touchstart",start,{passive:false});
    el.addEventListener("touchend",end); el.addEventListener("touchcancel",end);
    el.addEventListener("mousedown",start);
    addEventListener("mouseup",end);
  }
  bindHold(btnUp,()=>shift(1));
  bindHold(btnDn,()=>shift(-1));
  document.getElementById("btnStart").onclick=reset;
  document.getElementById("btnAgain").onclick=()=>{ running=false; done=false; reset(); };

  requestAnimationFrame(loop);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",main);
else main();
</script>
</body>
</html>
